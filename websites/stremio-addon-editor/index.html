<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stremio Addon Editor</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>

    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <div id="title-box"><span class="title">Stremio Addon Editor</span></div>

    <div id="login-box">
      <form onsubmit="login(event)">
        <input id="email" type="email" placeholder="Email" required />
        <input id="password" placeholder="Password" required />
        <button type="submit">Login & Load Addons</button>
      </form>
    </div>

    <div id="addon-box">
      <span class="title">Addons (JSON)</span>
      <hr />
      <div id="addons"></div>
      <button onclick="save()">Save to Stremio</button>
    </div>
  </body>
</html>
